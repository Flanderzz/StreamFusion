[package]
name = "streamfusion-orc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow.workspace = true
jni.workspace = true
orc-rust = { version = "=0.9.0", default-features = false, optional = true }
arrow59 = { package = "arrow", version = "59", default-features = false, features = ["ffi"], optional = true }

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }
cmake = "0.1"

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]
reader-comparison = ["dep:orc-rust", "dep:arrow59"]
