rootLogger.level = INFO
rootLogger.appenderRef.file.ref = SuiteLog

appender.file.name = SuiteLog
appender.file.type = RollingFile
appender.file.fileName = ${sys:streamfusion.flink-suite.diagnostics}/paimon-${sys:mvn.forkNumber}.log
appender.file.filePattern = ${sys:streamfusion.flink-suite.diagnostics}/paimon-${sys:mvn.forkNumber}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d [%t] %-5p %c - %m%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 32MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 4
